name: Annual journal metrics sync

# Runs on July 1st at 07:00 UTC — after Clarivate publishes the new JCR
# data each June. Fetches Impact Factor and JCR quartile for every journal
# in the publications collection via the WOS Journals API and stores results
# in D1 via /api/journal-sync. Results appear in the citations dashboard.
#
# Manual trigger: Actions tab → Annual journal metrics sync → Run workflow.
# Required secrets: QC_SECRET, CLARIVATE_API_KEY
# Get your Clarivate key at: developer.clarivate.com (use your WOS credentials)

on:
  schedule:
    - cron: '0 7 1 7 *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Sync journal metrics from JCR (Clarivate WOS Journals API)
        env:
          QC_SECRET:         ${{ secrets.QC_SECRET }}
          CLARIVATE_API_KEY: ${{ secrets.CLARIVATE_API_KEY }}
        run: |
          if [ -z "${QC_SECRET}" ]; then
            echo "::error::QC_SECRET secret is not set."
            exit 1
          fi
          if [ -z "${CLARIVATE_API_KEY}" ]; then
            echo "::error::CLARIVATE_API_KEY secret is not set."
            echo "Get your key at developer.clarivate.com (Web of Science Journals API)."
            exit 1
          fi

          python scripts/journal-sync.py \
            "https://yarivitzkovich.org/api/journal-sync" \
            "${QC_SECRET}"
