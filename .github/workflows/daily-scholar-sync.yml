name: Daily Scholar sync

# Runs every day at 06:00 UTC (09:00 Israel time).
# Fetches Yariv's Google Scholar profile, extracts per-paper citation counts
# and citing-paper details (including self-citation detection), then posts
# the data to /api/scholar-sync which stores it in D1.
#
# An email is sent to the owner whenever any citation count increases.
# Manual trigger: Actions tab → Daily Scholar sync → Run workflow.
#
# Required secret: QC_SECRET (same token used by daily-qc and daily-citations)

on:
  # DAILY SCHEDULE DISABLED (2026-05-29). Google Scholar blocks server-side
  # scraping, so scholar-sync.py fails almost every run from a GitHub runner
  # (no residential proxy) — it was red daily and generated noise.
  # Authoritative Google Scholar numbers now come from the MANUAL browser
  # console script (scripts/scholar-console.js), which runs in a logged-in
  # browser and isn't blocked. Kept manual-only; re-enable by restoring the
  # schedule block below if a working SCRAPER_API_KEY is ever configured.
  # schedule:
  #   - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests scholarly

      - name: Sync from Google Scholar
        env:
          QC_SECRET: ${{ secrets.QC_SECRET }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          if [ -z "${QC_SECRET}" ]; then
            echo "::error::QC_SECRET secret is not set."
            exit 1
          fi

          python scripts/scholar-sync.py \
            "https://yarivitzkovich.org/api/scholar-sync" \
            "${QC_SECRET}"
