name = "yarivitzkovich-site"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "yarivitzkovich-events"
database_id = "252c466c-1964-4c86-879e-a19fed515827"
migrations_dir = "db/migrations"

[vars]
LAUNCH_DATE = "2026-05-05"
CF_WEB_ANALYTICS_TAG = "0ca13efdb537426bb1de7c0f56dc4c3c"
# Comma-separated list of cities the owner regularly browses from. Any
# event geo-tagged to one of these cities is silently dropped before it
# reaches D1 — works regardless of which device/OS the owner is using.
# Edit this list (and re-deploy) to add cities the owner travels to.
OWNER_CITIES = "Kfar Saba,Jerusalem,Tel Aviv,Petah Tiqva,Ariel,Hadera,Netanya"
# Comma-separated public IPs that are auto-recognised as owner without
# any cookie. Add a network with: `npm run claim-this-network` from a
# device on that wifi (script reads your current IP, appends it here,
# commits + redeploys). Mobile data IPs aren't reliable for this since
# carriers rotate them — those devices use the cookie path instead.
OWNER_IPS = "2a00:a041:e62b:c600:de8:faef:988c:3824,2a00:a041:e62b:c600:5d67:f337:2217:8f38,2a00:a041:e62b:c600:b90d:f108:9890:87c0,2a00:a041:e62b:c600:995a:f4c5:6812:a975,2a00:a041:e62b:c600:5d5c:49bd:24a9:181c,2a00:a041:e62b:c600:3dbc:1670:32a3:5d03,2a00:a041:e62b:c600:2522:66ba:20a1:491f,2a00:a041:e62b:c600:5d7b:54c7:3a09:dee9,2a00:a041:e62b:c600:f4f1:636f:2efc:73f,2a00:a041:e62b:c600:688e:d144:bc68:6ecd,2a00:a041:e62b:c600:4df1:4d0d:314b:6e9c,2a00:a041:e62b:c600:bc54:d882:2a68:7861,2a00:a041:e62b:c600:b45b:d4f3:5ac0:f998,2a00:a041:e62b:c600:f41d:e751:f15e:f68c,2a00:a041:e62b:c600:ed2a:221c:a4cc:a849,2a00:a041:e62b:c600:5162:b89d:a20d:db54,2a00:a041:e62b:c600:a82e:c6f3:3b51:a4db,2a00:a041:e60a:4300:f028:beb9:b2b5:e1c0,2a00:a041:e60a:4300:9df4:501f:d59b:cb6,2a00:a041:e60a:4300:cc27:e4d5:9622:ed28,2a00:a041:e60a:4300:146e:c435:a81c:75b6,2a00:a041:e60a:4300:d5dd:1301:f76e:6a31,2a00:a041:e60a:4300:e516:2d64:85f:7e5f,2a00:a041:e60a:4300:75c3:599f:754c:e243,2a00:a041:e60a:4300:7da4:2a32:7d3f:d58,2a00:a041:e60a:4300:a5e4:9826:f91f:3706,2a00:a041:e60a:4300:4c8d:9342:744:c103,2a00:a041:e60a:4300:c5b3:fc72:807:b586,2a00:a041:e60a:4300:90c4:f49d:b615:1e99,192.114.52.9,2a00:a041:e60a:4300:e8b1:cb70:b04e:141,2a00:a041:e60a:4300:ac02:71a2:2bdc:3ee6,2a00:a041:e60a:4300:936:ee60:8d74:2bd7,2a00:a041:e60a:4300:d913:d3a6:da02:3b07,2a00:a041:e60a:4300:bd5e:e719:d1a6:80"
