name = "yarivitzkovich-site"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "yarivitzkovich-events"
database_id = "252c466c-1964-4c86-879e-a19fed515827"
migrations_dir = "db/migrations"

[vars]
LAUNCH_DATE = "2026-05-05"
CF_WEB_ANALYTICS_TAG = "0ca13efdb537426bb1de7c0f56dc4c3c"
# Comma-separated list of cities the owner regularly browses from. Any
# event geo-tagged to one of these cities is silently dropped before it
# reaches D1 — works regardless of which device/OS the owner is using.
# Edit this list (and re-deploy) to add cities the owner travels to.
OWNER_CITIES = "Kfar Saba,Jerusalem,Tel Aviv,Petah Tiqva,Ariel,Hadera,Netanya"
# Networks and addresses auto-recognised as owner, with no cookie.
#
# An IPv6 entry matches the whole /64 it names, because macOS and iOS rotate
# the second half of an address every few days as a privacy feature. Listing
# single addresses meant being un-recognised on his own wifi every time one
# rotated: this list had grown to 83 entries, which collapse to the 4 networks
# below plus 5 fixed IPv4 addresses. Matching the network instead means the
# wifi keeps working through every rotation and for every device on it.
#
# IPv4 stays exact — a campus and a few carriers, where widening to a /24
# would hand owner access to a stranger on the same ISP.
#
# Mobile data still rotates its network as well as its address, so phones use
# the cookie path (/api/auth-owner?owner=<OWNER_SECRET>, good for 400 days).
OWNER_IPS = "2a00:a041:e62b:c600::/64,2a00:a041:e60a:4300::/64,2a00:a041:e654:1c00::/64,2a02:6680:1104:1821::/64,192.114.52.9,195.47.41.82,109.67.189.38,5.29.18.41,188.64.207.159"

